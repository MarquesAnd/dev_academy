<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Cursos · Dev Academy</title>
<link rel="icon" type="image/png" sizes="48x48" href="icons/favicon-48.png">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="icons/favicon-16.png">
<link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#141F3C">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Dev Academy">

<link rel="stylesheet" href="shared/dev-academy.css?v=3">
</head>
<body class="locked">
<div class="da-wrap">
  <div class="da-hero">
    <div class="bigast">📚</div>
    <h1>Todos os <span>cursos</span></h1>
    <p>A trilha completa da Dev Academy: escolha por onde continuar. Seu progresso, XP e certificados acompanham você em qualquer curso — tudo salvo na nuvem.</p>
  </div>
  <div id="lista" class="da-grid"></div>
</div>
<script src="config.js?v=3"></script>
<script src="shared/dev-academy.js?v=3"></script>
<script>
(async function(){
  const u = await DA.requireAuth(); if(!u) return;
  DA.nav('cursos');
  const { rows } = await DA.listProgress();
  const cx = rows.find(r=>r.curso_id==='cortex-fundamentos');
  const ht = rows.find(r=>r.curso_id==='html-completo');
  const cs = rows.find(r=>r.curso_id==='css-completo');
  const ce = (cs && cs.estado) || {};
  const cfeitos = (ce.done||[]).length;
  const he = ht ? (ht.estado||{}) : {};
  const hfeitos = (he.done||[]).length;
  const jv = rows.find(r=>r.curso_id==='java-completo');
  const jve = jv ? (jv.estado||{}) : {};
  const jvf = (jve.done||[]).length;
  const gg = rows.find(r=>r.curso_id==='java-jogo-plataforma');
  const gge = gg ? (gg.estado||{}) : {};
  const ggf = (gge.done||[]).length;
  const mc = rows.find(r=>r.curso_id==='java-minecraft');
  const mce = mc ? (mc.estado||{}) : {};
  const mcf = (mce.done||[]).length;
  const jg = rows.find(r=>r.curso_id==='blocos-logica');
  const je = jg ? (jg.estado||{}) : {};
  const jm = Object.keys(je.estrelas||{}).length;
  const jstars = Object.values(je.estrelas||{}).reduce((a,b)=>a+b,0);
  const estado = cx ? (cx.estado||{}) : {};
  const pct = Math.min(100, Math.round(((estado.done||[]).length/61)*100));
  const lista = document.getElementById('lista');
  lista.innerHTML =
    '<div class="da-card">'+
      '<div class="top g-blue"><span class="emo">🧠</span><div><h3>CORTEX Academy</h3><small>Programação do zero ao projeto final</small></div></div>'+
      '<div class="body">'+
        '<div class="da-note">10 módulos · 61 etapas · HTML, CSS, JavaScript, SQL, Supabase e manutenção — tudo com exemplos reais do CORTEX.</div>'+
        '<div class="da-prog"><div style="width:'+pct+'%"></div></div>'+
        '<div class="da-note">'+(pct===0?'Ainda não iniciado':(pct===100?'🏆 100% concluído — Diretor(a) Clínico(a) do Código!':pct+'% concluído · ⚡ '+(estado.xp||0)+' XP'))+'</div>'+
        '<a class="da-btn" href="curso-cortex.html" style="margin-top:auto">'+(pct===0?'▶ Começar':'▶ Continuar')+'</a>'+
      '</div>'+
    '</div>'+
    '<div class="da-card">'+
      '<div class="top g-amber"><span class="emo">🏗️</span><div><h3>HTML Completo</h3><small>Do zero ao avançado · 8 módulos</small></div></div>'+
      '<div class="body">'+
        '<div class="da-note">A linguagem inteira: textos, links, imagens, tabelas, formulários, semântica, mídia e validação — com código ao vivo, lacunas e oficinas de blocos.</div>'+
        '<div class="da-prog"><div style="width:'+Math.round(hfeitos/50*100)+'%"></div></div>'+
        '<div class="da-note">'+(hfeitos===0?'Ainda não iniciado':(he.dip?'🎓 Concluído! ⚡ '+(he.xp||0)+' XP':hfeitos+'/50 etapas · ⚡ '+(he.xp||0)+' XP'))+'</div>'+
        '<a class="da-btn amber" href="curso-html.html" style="margin-top:auto">'+(hfeitos===0?'▶ Começar':'▶ Continuar')+'</a>'+
      '</div>'+
    '</div>'+
    '<div class="da-card">'+
      '<div class="top g-purple"><span class="emo">🎨</span><div><h3>CSS Completo</h3><small>Do zero ao avançado · 8 módulos</small></div></div>'+
      '<div class="body">'+
        '<div class="da-note">Vista seu HTML: cores, caixas, flexbox, grid, animações e design responsivo — com oficinas de estilo batendo a meta visual.</div>'+
        '<div class="da-prog"><div style="width:'+Math.round(cfeitos/47*100)+'%"></div></div>'+
        '<div class="da-note">'+(cfeitos===0?'Ainda não iniciado':(ce.dip?'🎓 Concluído! ⚡ '+(ce.xp||0)+' XP':cfeitos+'/47 etapas · ⚡ '+(ce.xp||0)+' XP'))+'</div>'+
        '<a class="da-btn" href="curso-css.html" style="margin-top:auto;background:linear-gradient(135deg,#7C4DFF,#EC4899)">'+(cfeitos===0?'▶ Começar':'▶ Continuar')+'</a>'+
      '</div>'+
    '</div>'+
    '<div class="da-card">'+
      '<div class="top g-amber" style="background:linear-gradient(135deg,#7C2D12,#EA580C)"><span class="emo">☕</span><div><h3>Java Completo</h3><small>Do zero ao avançado · 8 módulos</small></div></div>'+
      '<div class="body">'+
        '<div class="da-note">A linguagem dos bancos, do Android e do Minecraft — com o laboratório JavaBox rodando seu código na hora: variáveis, loops, métodos, coleções e a OO completa.</div>'+
        '<div class="da-prog"><div style="width:'+Math.round(jvf/54*100)+'%"></div></div>'+
        '<div class="da-note">'+(jvf===0?'Ainda não iniciado':(jve.dip?'🎓 Concluído! ⚡ '+(jve.xp||0)+' XP':jvf+'/54 etapas · ⚡ '+(jve.xp||0)+' XP'))+'</div>'+
        '<a class="da-btn" href="curso-java.html" style="margin-top:auto;background:linear-gradient(135deg,#EA580C,#F59E0B)">'+(jvf===0?'▶ Começar':'▶ Continuar')+'</a>'+
      '</div>'+
    '</div>'+
    '<div class="da-card">'+
      '<div class="top g-blue" style="background:linear-gradient(135deg,#312E81,#7C4DFF)"><span class="emo">🕹️</span><div><h3>Java: seu 1º Jogo</h3><small>Plataforma jogável · 12 missões</small></div></div>'+
      '<div class="body">'+
        '<div class="da-note">Construa um jogo de plataforma completo EM JAVA, jogável aqui: física, pulo, colisão, moedas, inimigos, câmera e a SUA fase autoral — com teste automático por missão.</div>'+
        '<div class="da-prog"><div style="width:'+Math.round(ggf/40*100)+'%"></div></div>'+
        '<div class="da-note">'+(ggf===0?'Ainda não iniciado':(gge.dip?'🎓 Concluído! ⚡ '+(gge.xp||0)+' XP':ggf+'/40 etapas · ⚡ '+(gge.xp||0)+' XP'))+'</div>'+
        '<a class="da-btn" href="curso-java-jogo.html" style="margin-top:auto;background:linear-gradient(135deg,#7C4DFF,#22D3EE)">'+(ggf===0?'▶ Apertar START':'▶ Continuar')+'</a>'+
      '</div>'+
    '</div>'+
    '<div class="da-card">'+
      '<div class="top g-green" style="background:linear-gradient(135deg,#14532D,#16A34A)"><span class="emo">⛏️</span><div><h3>Java no Minecraft</h3><small>O jogo real por dentro · 8 módulos</small></div></div>'+
      '<div class="body">'+
        '<div class="da-note">A autópsia do jar verdadeiro: 10.291 classes, o relógio de 20 ticks, entidades com herança, NBT, eventos, redstone booleana — e seu primeiro plugin de servidor.</div>'+
        '<div class="da-prog"><div style="width:'+Math.round(mcf/44*100)+'%"></div></div>'+
        '<div class="da-note">'+(mcf===0?'Ainda não iniciado':(mce.dip?'🎓 Concluído! ⚡ '+(mce.xp||0)+' XP':mcf+'/44 etapas · ⚡ '+(mce.xp||0)+' XP'))+'</div>'+
        '<a class="da-btn green" href="curso-java-minecraft.html" style="margin-top:auto">'+(mcf===0?'▶ Abrir o baú':'▶ Continuar')+'</a>'+
      '</div>'+
    '</div>'+
    '<div class="da-card">'+
      '<div class="top g-green"><span class="emo">🧱</span><div><h3>Lógica com Blocos</h3><small>Jogo · para crianças e iniciantes</small></div></div>'+
      '<div class="body">'+
        '<div class="da-note">Monte o código com blocos de encaixar e veja o Robô Bip obedecer na tela. 10 missões com estrelas, muros e o poderoso bloco repetir.</div>'+
        '<div class="da-prog"><div style="width:'+Math.round(jm/10*100)+'%"></div></div>'+
        '<div class="da-note">'+(jm===0?'Ainda não iniciado':(je.dip?'👑 Jogo zerado! ⭐ '+jstars+' de 30':jm+'/10 missões · ⭐ '+jstars))+'</div>'+
        '<a class="da-btn green" href="jogo-blocos.html" style="margin-top:auto">'+(jm===0?'🎮 Jogar':'🎮 Continuar')+'</a>'+
      '</div>'+
    '</div>'+
    [['🗄️','SQL Avançado na prática','Relatórios, índices e performance direto no banco do CORTEX.'],
     ['🤖','Automação & IA na clínica','Edge Functions, integrações e assistentes para o dia a dia.'],
     ['🚀','Git & Deploy profissional','Branches, versões e publicações sem medo.']]
    .map(c=>'<div class="da-card" style="opacity:.75">'+
      '<div class="top g-gray"><span class="emo">'+c[0]+'</span><div><h3>'+c[1]+'</h3><small>Próxima turma da Academy</small></div></div>'+
      '<div class="body"><div class="da-note">'+c[2]+'</div>'+
      '<button class="da-btn" disabled style="margin-top:auto">🔒 Em breve</button></div></div>').join('');
})();
</script>
</body>
</html>
