<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Certificados · Dev Academy</title>
<link rel="icon" type="image/png" sizes="48x48" href="icons/favicon-48.png">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="icons/favicon-16.png">
<link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#141F3C">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Dev Academy">

<link rel="stylesheet" href="shared/dev-academy.css?v=3">
</head>
<body class="locked">
<div class="da-wrap">
  <div class="da-hero no-print">
    <div class="bigast">🎓</div>
    <h1>Seus <span>certificados</span></h1>
    <p>Conquistas oficiais da Dev Academy. Complete um curso inteiro (todas as lições + todos os quizzes) para emitir o seu.</p>
  </div>
  <div id="area"></div>
</div>
<script src="config.js?v=3"></script>
<script src="shared/dev-academy.js?v=3"></script>
<script>
(async function(){
  const u = await DA.requireAuth(); if(!u) return;
  DA.nav('certificados');
  const { rows } = await DA.listProgress();
  const area = document.getElementById('area');
  const NOMES = {
    'cortex-fundamentos': 'CORTEX Academy — Programação do Zero ao Projeto Final',
    'blocos-logica': 'Lógica com Blocos — As 10 Missões do Robô Bip',
    'html-completo': 'HTML Completo — Do Zero ao Avançado',
    'css-completo': 'CSS Completo — Do Zero ao Avançado'
  };
  const SELOS = {
    'cortex-fundamentos': '👑 Diretor(a) Clínico(a) do Código',
    'blocos-logica': '🤖 Mestre(a) dos Blocos',
    'html-completo': '🏗️ Mestre(a) do HTML',
    'css-completo': '🎨 Mestre(a) do CSS'
  };
  const DESCR = {
    'cortex-fundamentos': 'dominando HTML, CSS, JavaScript, SQL/Supabase e o protocolo profissional de manutenção',
    'blocos-logica': 'dominando sequências, direções e repetições — os fundamentos do pensamento computacional',
    'html-completo': 'dominando a estrutura, a semântica e a acessibilidade da web — de textos e tabelas a formulários com validação',
    'css-completo': 'dominando seletores, o modelo de caixa, flexbox, grid, animações e design responsivo'
  };
  const certs = rows.filter(r => r.estado && r.estado.dip);
  if(certs.length === 0){
    const cx = rows.find(r=>r.curso_id==='cortex-fundamentos');
    const feitos = cx ? ((cx.estado||{}).done||[]).length : 0;
    area.innerHTML = '<div class="da-card"><div class="top g-navy"><span class="emo">🔒</span><div><h3>Nenhum certificado ainda</h3><small>Mas você está a caminho!</small></div></div>'+
      '<div class="body"><div class="da-note">Progresso no CORTEX Academy: <b>'+feitos+' de 61 etapas</b>. Ao concluir 100%, seu certificado aparece aqui, com seu nome, pronto para imprimir ou salvar em PDF.</div>'+
      '<a class="da-btn" href="curso-cortex.html" style="margin-top:auto">▶ Continuar o curso</a></div></div>';
    return;
  }
  area.innerHTML = certs.map(c=>{
    const e = c.estado||{};
    const quando = e.dip_em ? new Date(e.dip_em) : new Date(c.atualizado_em);
    const data = quando.toLocaleDateString('pt-BR', {day:'2-digit',month:'long',year:'numeric'});
    return '<div class="cert">'+
      '<div class="marca">✱</div>'+
      '<div style="font-size:2.4rem">🎓</div>'+
      '<h2>CERTIFICADO DE CONCLUSÃO</h2>'+
      '<div class="sub">A <b>Dev Academy · Equilibrium</b> certifica que</div>'+
      '<div class="nome">'+DA.nome()+'</div>'+
      '<div class="sub">concluiu com êxito o curso<br><b>'+(NOMES[c.curso_id]||c.curso_id)+'</b><br>'+
      (DESCR[c.curso_id]||'concluindo todas as etapas')+' — com <b>⚡ '+(e.xp||0)+' XP</b> conquistados.</div>'+
      '<div class="selo">'+(SELOS[c.curso_id]||'🎓 Concluído')+'</div>'+
      '<div class="sub" style="margin-top:14px">Uberlândia/MG · '+data+'</div>'+
      '<div class="sub" style="margin-top:4px">✱ Prof. Asterisco · Dev Academy</div>'+
      '<button class="da-btn no-print" style="margin-top:16px" onclick="window.print()">🖨️ Imprimir / salvar PDF</button>'+
    '</div>';
  }).join('<div style="height:20px"></div>');
})();
</script>
</body>
</html>
